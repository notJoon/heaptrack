name: CI

on:
  push:
    branches: [macos-native]
  pull_request:
    branches: [macos-native]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS 14 (arm64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install boost ninja zstd

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHEAPTRACK_BUILD_GUI=OFF

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          ./build/bin/heaptrack_print tests/auto/heaptrack.david.18594.gz > print.out
          grep -q "MOST CALLS TO ALLOCATION FUNCTIONS" print.out

  linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libunwind-dev libelf-dev libdw-dev zlib1g-dev libzstd-dev \
            libboost-iostreams-dev libboost-program-options-dev \
            libboost-filesystem-dev libboost-container-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHEAPTRACK_BUILD_GUI=OFF \
            -DHEAPTRACK_BUILD_INTERPRET=ON

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure
